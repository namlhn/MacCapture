name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Build MacCapture
        run: |
          xcodebuild build \
            -project MacCapture.xcodeproj \
            -scheme MacCapture \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project MacCapture.xcodeproj \
            -scheme MacCapture \
            -destination 'platform=macOS' \
            -only-testing:MacCaptureTests \
            CODE_SIGNING_ALLOWED=NO
